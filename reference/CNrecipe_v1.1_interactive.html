function health(i){if(!i.until)return {days:null,percent:null,label:'Date not set',status:'none',color:'#a0a39a'};let days=daysTill(i.until),span=Math.max(1,Math.round((parsed(i.until)-parsed(i.added))/86400000)),percent=Math.max(0,Math.min(100,(days/span)*100));if(days<0)return {days,percent:0,label:'Date passed',status:'past',color:'#c65b40'};if(days===0)return {days,percent:4,label:'Check today',status:'past',color:'#c65b40'};if(days<=2)return {days,percent:Math.max(7,percent),label:`${days}d left`,status:'soon',color:'#d2a047'};return {days,percent,label:`${days}d left`,status:'good',color:'#5e8a67'}}

function settings(){return `<div class="page">${backbar('Settings')}<div class="eyebrow">YOUR KITCHEN, YOUR WAY</div><h1 class="serif" style="margin:10px 0">Preferences</h1><div class="section-head"><h3>Cooking preferences</h3></div>${settingRow('Language','Interface language','<select aria-label="Language"><option>English</option></select>')}${settingRow('Region','For local ingredient references',`<select name="region" aria-label="Region">${['United States','United Kingdom','Canada','Australia'].map(x=>`<option ${state.region===x?'selected':''}>${x}</option>`).join('')}</select>`)}${settingRow('Measurement units','Default recipe quantities',`<select name="units" aria-label="Measurement units"><option ${state.units==='US'?'selected':''}>US</option><option ${state.units==='Metric'?'selected':''}>Metric</option></select>`)}${settingRow('Larger cooking text','Easier to read while cooking',`<button class="switch ${state.largeText?'active':''}" role="switch" aria-checked="${state.largeText}" data-action="large-text"><span></span></button>`)}<div class="section-head"><h3>Ingredient alerts</h3></div><p class="sub">Highlight declared allergens. Always check labels and cross-contact.</p>${['Peanuts','Soy','Wheat','Eggs','Sesame'].map(x=>settingRow(x,'Highlight this ingredient',`<button class="switch ${state.allergens.has(x)?'active':''}" role="switch" aria-label="${x} alerts" aria-checked="${state.allergens.has(x)}" data-allergy="${x}"><span></span></button>`)).join('')}<div class="section-head"><h3>About</h3></div><div class="note warning">CNrecipe V1.1 interactive prototype. Recipe and storage content is illustrative. Not a commercial food safety system.</div><button class="button secondary" data-action="reset-demo">Reset prototype demo data</button></div>`}
function modal(){if(!state.modal)return '';let i=state.pantry.find(p=>p.id===state.editId);let title=state.modal==='edit'?'Edit ingredient':state.modal==='add'?'Add ingredient':state.modal==='shopping'?'Add shopping item':'Ingredients at a glance';let body='';if(state.modal==='edit'||state.modal==='add'){
body=`<p class="sub">Record known dates and storage details. Leave the tracked date blank if unknown.</p><form id="ingredient-form" data-form="ingredient"><div class="field"><label for="f-name">Ingredient name</label><input id="f-name" name="f-name" maxlength="70" required placeholder="e.g. Fresh mushrooms" value="${esc(i?.name||'')}"></div><div class="field-grid"><div class="field"><label for="f-group">Category</label><select id="f-group" name="f-group">${groups.map(([g])=>`<option ${g===(i?.group||'Produce')?'selected':''}>${g}</option>`).join('')}</select></div><div class="field"><label for="f-qty">Quantity</label><input id="f-qty" name="f-qty" maxlength="35" value="${esc(i?.qty||'1 item')}"></div></div><div class="field-grid"><div class="field"><label for="f-storage">Storage</label><select id="f-storage" name="f-storage">${['Fridge','Freezer','Pantry'].map(x=>`<option ${x===(i?.storage||'Fridge')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="f-type">Date label</label><select id="f-type" name="f-type">${['Best before','Use by','Review on'].map(x=>`<option ${x===(i?.type||'Review on')?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field-grid"><div class="field"><label for="f-added">Added on</label><input id="f-added" name="f-added" type="date" required value="${esc(i?.added||dateOffset(0))}"></div><div class="field"><label for="f-until">Tracked date</label><input id="f-until" name="f-until" type="date" value="${esc(i?.until||'')}"></div></div><p class="hint">The health-style bar is based only on these dates. A “best before” date is not the same as a food safety cutoff. Do not assign an invented use-by date.</p>${state.formError?`<p class="error" role="alert">${esc(state.formError)}</p>`:''}<button class="button" type="submit" style="margin-top:12px">${i?'Save changes':'Add to kitchen'}</button></form>${i?`<button class="button ghost" data-action="delete-ingredient">Remove ingredient</button>`:''}`;
}else if(state.modal==='shopping'){
body=`<p class="sub">Add a missing ingredient to the shopping list.</p><form data-form="shopping"><div class="field"><label for="f-shopping">Item name</label><input id="f-shopping" name="f-shopping" required maxlength="80" placeholder="e.g. Sesame oil"></div><button class="button" type="submit" style="margin-top:15px">Add to list</button></form>`;
}else{let r=selectedRecipe();let pauseNote=(state.screen==='cook'&&!state.timer.running&&Number(state.timer.remaining)>0)?`<p class="note" role="status">Timer paused — close this sheet, then tap Resume timer to continue.</p>`:'';body=`${pauseNote}<p class="sub">${r.name} · ${state.servings} servings</p>${r.items.map(i=>`<div class="item-row"><span>${esc(i.name)}</span><span aria-label="${esc(i.name)}: ${quantity(i)}">${quantity(i)}</span></div>`).join('')}`}
return `<div class="sheet-shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="round" data-action="dismiss" aria-label="Close dialog">${icon('close')}</button></div>${body}</section></div>`}
function page(){switch(state.screen){case 'explore':return explore();case 'kitchen':return kitchen();case 'detail':return detail();case 'prep':return prepare();case 'cook':return cooking();case 'complete':return complete();case 'saved':return saved();case 'settings':return settings();default:return explore()}}
const screens=[['explore','Explore','home'],['kitchen','My Kitchen','kitchen'],['saved','Saved','heart'],['detail','Recipe Detail','info'],['prep','Preparation','check'],['cook','Cooking Mode','kitchen'],['complete','Completion','check'],['settings','Settings','settings']];
function render(resetScroll=false){let prev=app.querySelector('.viewport'),scroll=prev?.scrollTop||0;let active=screens.find(x=>x[0]===state.screen)||screens[0];app.innerHTML=`<div class="studio"><aside class="rail"><div class="wordmark">CN<b>recipe</b> ✳</div><p class="rail-copy">Chinese cooking, made simple.<br>Interactive prototype · v1.1</p><div class="rail-nav"><div class="rail-heading">PAGE NAVIGATION</div>${screens.map(([id,label,i],n)=>`<button class="rail-button ${state.screen===id?'active':''}" data-go="${id}">${icon(i)} ${label}<small>${String(n+1).padStart(2,'0')}</small></button>`).join('')}</div></aside><main class="phone-shell"><div class="phone"><div class="status"><span>9:41</span><span>◉ ▰ ▰</span></div><div class="viewport ${['detail','prep','cook','complete','settings'].includes(state.screen)?'task':''}">${page()}</div>${['explore','kitchen','saved'].includes(state.screen)?nav():''}${modal()}${state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:''}</div></main><aside class="inspector"><div class="rail-heading">CNRECIPE · DESIGN V1.1</div><div class="eyebrow" style="margin-top:18px">SCREEN ${String(screens.indexOf(active)+1).padStart(2,'0')} / 08</div><h2>${state.screen==='explore'?'Cook first. Discover second.':state.screen==='kitchen'?'See what needs attention.':state.screen==='cook'?'One step at a time.':'Designed for real kitchen tasks.'}</h2><p>${state.screen==='explore'?'A distraction-free search landing page. Categories open the full recipe browser.':state.screen==='kitchen'?'Grouped ingredients, editable dates, time-remaining bars, and a shopping list.':state.screen==='cook'?'Big instructions, clear step navigation, optional timer and session recovery.':'A connected interactive product prototype with persistent local data.'}</p><div class="info-card"><strong>EXPERIENCE CHECKLIST</strong><div>01 · Minimal Explore + tabs</div><div>02 · Floating pill navigation</div><div>03 · Categorized My Ingredients</div><div>04 · Storage timeline “health”</div><div>05 · Search + cooking + Saved</div></div><p style="font-size:10px;margin-top:20px">Prototype uses sample recipes and externally hosted temporary imagery. Photos require verified rights before commercial use.</p></aside></div>`;let v=app.querySelector('.viewport');if(v&&!resetScroll)v.scrollTop=scroll;document.title=`CNrecipe · ${active[1]} · V1.1`}
function go(screen){state.modal=null;state.formError='';state.screen=screen;render(true)}
function chooseRecipe(id){if(!recipes.some(x=>x.id===id))return;state.selected=id;state.servings=2;state.checked=new Set();state.step=0;resetTimer();go('detail')}
function toast(message){state.toast=message;render(false);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>{state.toast='';render(false)},2400)}
function addShopping(names){for(const name of names){if(!state.shopping.has(name))state.shopping.set(name,false)}persist()}
function resetTimer(){state.timer={deadline:null,remaining:0,running:false}}
function startTimer(){let recommended=selectedRecipe().steps[state.step][3];let duration=timerRemaining()||recommended;if(!duration)return;state.timer={deadline:Date.now()+duration*1000,remaining:duration,running:true};render(false)}
function pauseTimer(){state.timer={deadline:null,remaining:timerRemaining(),running:false};render(false)}
function moveStep(by){let r=selectedRecipe();if(by===1&&state.step===r.steps.length-1){resetTimer();state.ongoing=null;persist();go('complete');return}state.step=Math.max(0,Math.min(r.steps.length-1,state.step+by));resetTimer();state.ongoing={recipeId:r.id,step:state.step,servings:state.servings};persist();render(true)}
function resume(){let session=state.ongoing;if(!session)return;state.selected=session.recipeId;state.step=Math.max(0,Math.min(selectedRecipe().steps.length-1,session.step||0));state.servings=session.servings||2;go('cook')}
function addIngredientFromForm(){let form=app.querySelector('#ingredient-form');if(!form)return;const get=n=>form.elements.namedItem(n)?.value?.trim()||'';let name=get('f-name'),added=get('f-added'),until=get('f-until'),group=get('f-group');if(!name){state.formError='Please enter an ingredient name.';render(false);return}if(!added){state.formError='Please select the date you added this ingredient.';render(false);return}if(until&&parsed(until)<parsed(added)){state.formError='The tracked date cannot be earlier than the added date.';render(false);return}let existing=state.pantry.find(x=>x.id===state.editId);let val={id:existing?.id||Date.now(),name,qty:get('f-qty')||'1 item',group,storage:get('f-storage'),type:get('f-type'),added,until,emoji:existing?.emoji||(group==='Produce'?'🥬':group==='Meat & Protein'?'🍗':group==='Dairy & Eggs'?'🥚':'🫙')};if(existing)Object.assign(existing,val);else state.pantry.push(val);state.modal=null;state.formError='';state.pantryFilter='all';persist();toast(existing?'Ingredient updated':'Ingredient added')}
app.addEventListener('click',event=>{
if(event.target.classList.contains('sheet-shade')){state.modal=null;render(false);return}
let el=event.target.closest('[data-go],[data-etab],[data-quick],[data-filter],[data-recipe],[data-ktab],[data-pfilter],[data-edit],[data-stab],[data-check],[data-shop],[data-delete-shop],[data-action],[data-rate],[data-units],[data-allergy],[data-resume-id]');if(!el||!app.contains(el))return;
if(el.dataset.go){if(el.dataset.go==='cook'&&state.ongoing){resume();return}go(el.dataset.go);return}
if(el.dataset.etab){state.exploreTab=el.dataset.etab;render(true);return}
if(el.dataset.quick){state.filter=el.dataset.quick;state.query='';state.exploreTab='recipes';render(true);return}
if(el.dataset.filter){state.filter=el.dataset.filter;render(false);return}
if(el.dataset.recipe){chooseRecipe(el.dataset.recipe);return}
if(el.dataset.ktab){state.kitchenTab=el.dataset.ktab;render(false);return}
if(el.dataset.pfilter){state.pantryFilter=el.dataset.pfilter;state.kitchenTab='ingredients';render(false);return}
if(el.dataset.edit){state.editId=Number(el.dataset.edit);state.modal='edit';state.formError='';render(false);return}
if(el.dataset.stab){state.savedTab=el.dataset.stab;render(false);return}
if(el.dataset.resumeId){resume();return}
if(el.hasAttribute('data-check')){let n=Number(el.dataset.check);state.checked.has(n)?state.checked.delete(n):state.checked.add(n);render(false);return}
if(el.dataset.deleteShop){event.stopPropagation();state.shopping.delete(el.dataset.deleteShop);persist();render(false);return}
if(el.dataset.shop){let n=el.dataset.shop;state.shopping.set(n,!state.shopping.get(n));persist();render(false);return}
if(el.dataset.rate){state.rating=Number(el.dataset.rate);render(false);return}
if(el.dataset.units){state.units=el.dataset.units;persist();render(false);return}
if(el.dataset.allergy){let a=el.dataset.allergy;state.allergens.has(a)?state.allergens.delete(a):state.allergens.add(a);persist();render(false);return}
switch(el.dataset.action){
case 'clear-search':state.query='';state.filter='All';render(false);break;
case 'add-ingredient':state.editId=null;state.modal='add';state.formError='';render(false);break;
case 'add-shopping':state.modal='shopping';render(false);break;
case 'dismiss':state.modal=null;render(false);break;
case 'delete-ingredient':state.pantry=state.pantry.filter(i=>i.id!==state.editId);state.modal=null;persist();toast('Ingredient removed');break;
case 'clear-purchased':for(const [name,checked] of state.shopping)if(checked)state.shopping.delete(name);persist();render(false);break;
case 'recipe-shopping':addShopping(selectedRecipe().items.map(i=>i.name));state.kitchenTab='shopping';go('kitchen');break;
case 'toggle-save':state.saved.has(state.selected)?state.saved.delete(state.selected):state.saved.add(state.selected);persist();render(false);break;
case 'servings-up':state.servings=Math.min(8,state.servings+1);render(false);break;
case 'servings-down':state.servings=Math.max(1,state.servings-1);render(false);break;
case 'missing-to-shop':addShopping(selectedRecipe().items.filter((_,i)=>!state.checked.has(i)).map(x=>x.name));state.kitchenTab='shopping';go('kitchen');break;
case 'mark-ready':state.checked=new Set(selectedRecipe().items.concat([{}]).map((_,i)=>i));render(false);break;
case 'start-cooking':state.step=0;resetTimer();state.ongoing={recipeId:state.selected,step:0,servings:state.servings};persist();go('cook');break;
case 'prev-step':moveStep(-1);break;
case 'next-step':moveStep(1);break;
case 'view-ingredients':if(state.timer.running)pauseTimer();state.modal='ingredients';render(false);break;
case 'pause-session':if(state.timer.running)pauseTimer();persist();go('explore');break;
case 'resume':resume();break;
case 'start-timer':startTimer();break;
case 'pause-timer':pauseTimer();break;
case 'save-completion':state.history.add(state.selected);state.saved.add(state.selected);state.savedTab='history';persist();go('saved');break;
case 'large-text':state.largeText=!state.largeText;persist();render(false);break;
case 'reset-demo':if(confirm('Reset prototype data to sample defaults?')){localStorage.removeItem('cnrecipe-v11-state');location.reload()}break;
}
});
app.addEventListener('submit',event=>{
const form=event.target.closest('form');if(!form)return;event.preventDefault();if(form.dataset.form==='search'){let input=form.querySelector('input');state.query=input?.value||'';state.filter='All';state.exploreTab='recipes';render(true)}
if(form.dataset.form==='ingredient')addIngredientFromForm();
if(form.dataset.form==='shopping'){let name=form.elements.namedItem('f-shopping')?.value.trim();if(name){addShopping([name]);state.modal=null;toast('Shopping item added')}}
});
app.addEventListener('input',event=>{let el=event.target;if(el.name==='home-search'||el.name==='recipe-search'){state.query=el.value;if(el.name==='recipe-search'){let cursor=el.selectionStart;render(false);let input=app.querySelector('[name=recipe-search]');if(input){input.focus();input.setSelectionRange(cursor,cursor)}}}if(el.name==='cooking-note')state.cookingNote=el.value});
app.addEventListener('change',event=>{if(event.target.name==='units'){state.units=event.target.value;persist();render(false)}if(event.target.name==='region'){state.region=event.target.value;persist();render(false)}});
app.addEventListener('keydown',event=>{let el=event.target;if(event.key==='Escape'&&state.modal){state.modal=null;render(false);return}if((event.key==='Enter'||event.key===' ')&&el.matches('[data-recipe],[data-edit],[data-shop],[data-check],[data-resume-id]')){event.preventDefault();el.click()}});
setInterval(()=>{if(state.screen==='cook'&&state.timer.running){let value=timerRemaining();let out=app.querySelector('#timer-readout');if(out)out.textContent=tformat(value);if(value===0){state.timer.running=false;state.timer.remaining=0;state.timer.deadline=null;toast('Timer done — advancing to next step');clearTimeout(autoAdvanceTimeout);autoAdvanceTimeout=setTimeout(()=>{if(state.screen==='cook'&&!state.timer.running)moveStep(1)},1400)}}},250);
render(true);
})();
</script>
</body>
</html>
