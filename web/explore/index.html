<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FAF9F6"><title>PotSteam · Explore</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div class="brand"><img src="assets/potsteam-logo.svg" alt="" aria-hidden="true" style="width:32px;height:32px;vertical-align:middle;margin-right:8px">PotSteam</div><button id="settings" class="round" aria-label="Settings"><img src="assets/ui-settings.svg" alt="" aria-hidden="true"></button></header>
<nav class="tabs" aria-label="Explore sections"><button id="home-tab" class="active">Home</button><button id="recipes-tab">Explore Recipes</button></nav>
